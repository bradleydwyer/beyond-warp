<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#03090b" />
    <meta name="description" content="A real-time, volumetric warp field inspired by Star Trek Beyond." />
    <title>Beyond — Warp field study</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M28 5Q-15 16 28 27Q-2 16 28 5' fill='%239addeb'/%3E%3C/svg%3E" />
  </head>
  <body>
    <main id="app">
      <canvas id="scene" aria-label="Animated 3D warp bubble bending starlight around a starship"></canvas>
      <div class="frame top-frame"></div><div class="frame bottom-frame"></div>
      <header class="interface masthead">
        <div class="identity"><span class="insignia" aria-hidden="true"></span><div><h1>BEYOND</h1><p>Warp field study</p></div></div>
        <div class="top-actions"><a href="https://www.youtube.com/watch?v=gCCYWTAA2wQ" target="_blank" rel="noreferrer">Reference <span aria-hidden="true">↗</span></a><button id="fullscreen" title="Fullscreen (F)" aria-label="Fullscreen">⛶</button></div>
      </header>
      <div class="interface reference-controls">
        <button id="reference-play" class="reference-button" aria-label="Play reference sequence" title="Replay the reference camera movement with its original audio">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5 11 7-11 7Z"/></svg>
          <span><span id="reference-action">Play reference</span><small id="reference-time">Original audio · 4.96 s</small></span>
          <span class="reference-progress" aria-hidden="true"><span id="reference-progress"></span></span>
        </button>
        <button id="reference-sound" class="sound-button" aria-label="Mute reference audio" aria-pressed="true" title="Mute reference audio">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4Z M15 8q4 4 0 8 M18 5q7 7 0 14"/></svg>
        </button>
      </div>
      <audio id="reference-audio" preload="auto"></audio>
      <div class="interface scene-caption"><span class="live-dot"></span><span id="view-label">EXTERIOR / TRACKING</span><span class="caption-rule"></span><span id="motion-label">FIELD ACTIVE</span></div>
      <section class="interface controls" aria-label="Warp controls">
        <div class="transport">
          <button class="play-button" id="play" aria-label="Pause animation" title="Pause (Space)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6v12M16 6v12"/></svg></button>
          <button class="replay-button" id="replay" title="Restart (R)" aria-label="Restart animation">↺</button>
        </div>
        <div class="view-control"><span class="control-label">Camera</span><div class="segmented" role="group" aria-label="Camera view"><button data-view="tracking" aria-pressed="true">Tracking</button><button data-view="bow" aria-pressed="false">Bow</button><button data-view="orbit" aria-pressed="false">Orbit</button><button data-view="ride" aria-pressed="false">On board</button><button data-view="flyby" aria-pressed="false" title="Follow the ship as it overtakes the camera, pulling back to reveal the full field">Flyby</button></div></div>
        <div class="appearance-control"><span class="control-label" id="appearance-label">Field appearance</span><div id="appearance" class="appearance-toggle" role="group" aria-labelledby="appearance-label"><button type="button" data-appearance="fluid" aria-pressed="false">Fluid glow</button><button type="button" data-appearance="glow" aria-pressed="true">Compressed glow</button><button type="button" data-appearance="space" aria-pressed="false">Compressed space</button></div><div id="space-controls" class="space-controls" hidden><label id="edge-glow-control" class="edge-glow-control" title="Brighten and bloom the outer background projections"><span class="control-label">Edge glow <output for="edgeGlow" id="edgeGlow-value">0%</output></span><input id="edgeGlow" type="range" min="0" max="3" step="0.01" value="0" /></label><label class="edge-glow-control"><span class="control-label">Projection width <output for="projectionWidth" id="projectionWidth-value">200%</output></span><input id="projectionWidth" type="range" min="0.5" max="4" step="0.01" value="2" /></label></div></div>
        <label class="slider-control"><span class="control-label">Warp speed <output for="speed" id="speed-value">10.0</output></span><input id="speed" type="range" min="1" max="10" step="0.1" value="10" /></label>
        <label class="slider-control"><span class="control-label">Turbulence <output for="turbulence" id="turbulence-value">150%</output></span><input id="turbulence" type="range" min="0" max="1.5" step="0.01" value="1.5" /></label>
        <label class="slider-control"><span class="control-label">Field intensity <output for="intensity" id="intensity-value">200%</output></span><input id="intensity" type="range" min="0" max="2" step="0.01" value="2" /></label>
        <label class="slider-control"><span class="control-label">Light bending <output for="lensing" id="lensing-value">70%</output></span><input id="lensing" type="range" min="0" max="2" step="0.01" value="0.7" /></label>
        <label class="slider-control"><span class="control-label">Bloom <output for="bloom" id="bloom-value">65%</output></span><input id="bloom" type="range" min="0" max="2" step="0.01" value="0.65" /></label>
        <label class="slider-control"><span class="control-label">Star density <output for="stars" id="stars-value">100%</output></span><input id="stars" type="range" min="0" max="2" step="0.01" value="1" /></label>
        <div class="extra-control"><label class="check-label"><input type="checkbox" id="ship" checked /> Show ship</label><select id="quality" aria-label="Render quality"><option value="balanced">Balanced quality</option><option value="high">High quality</option><option value="low">Low quality</option></select>
          <details id="effects" class="effects">
            <summary>Effects</summary>
            <div class="effects-panel">
              <fieldset><legend>Space</legend>
                <label class="effect-slider" title="Brightness of the volumetric nebula behind the field. 0% leaves the original faint fog."><span class="control-label">Nebula brightness <output for="nebula" id="nebula-value">100%</output></span><input id="nebula" type="range" min="0" max="2" step="0.01" value="1" /></label>
                <label class="effect-slider" title="Coverage of the nebula banks, filaments and dust lanes"><span class="control-label">Nebula density <output for="nebulaDensity" id="nebulaDensity-value">100%</output></span><input id="nebulaDensity" type="range" min="0" max="2" step="0.01" value="1" /></label>
                <label class="effect-slider" title="Sparse pink-violet highlights and hot knots in the banks, glowing through the gas in front of them. 0% leaves the banks blue."><span class="control-label">Nebula highlights <output for="nebulaGlow" id="nebulaGlow-value">100%</output></span><input id="nebulaGlow" type="range" min="0" max="2" step="0.01" value="1" /></label>
                <label class="effect-slider" title="Lifts the darkest space to deep blue instead of black"><span class="control-label">Black level <output for="blackLevel" id="blackLevel-value">100%</output></span><input id="blackLevel" type="range" min="0" max="2" step="0.01" value="1" /></label>
              </fieldset>
              <fieldset><legend>Field</legend>
                <label class="effect-slider" title="Darkens light seen through the bubble interiors. Scales with Light bending."><span class="control-label">Interior darkness <output for="interior" id="interior-value">92%</output></span><input id="interior" type="range" min="0" max="1" step="0.01" value="0.92" /></label>
                <label class="effect-slider" title="Demagnifies and softens the space seen through the interiors. Scales with Light bending."><span class="control-label">Interior shrink <output for="interiorShrink" id="interiorShrink-value">60%</output></span><input id="interiorShrink" type="range" min="0" max="1" step="0.01" value="0.6" /></label>
                <label class="effect-slider" title="Depth of the lit, churning whitewater band inside the bubble edge, in all three appearances. 0% leaves the original hairline."><span class="control-label">Crest thickness <output for="crestThickness" id="crestThickness-value">100%</output></span><input id="crestThickness" type="range" min="0" max="2" step="0.01" value="1" /></label>
                <label class="effect-slider" title="Key light from above: how much dimmer the lower edges are than the top"><span class="control-label">Crest lighting (top/bottom) <output for="crestLight" id="crestLight-value">85%</output></span><input id="crestLight" type="range" min="0" max="1" step="0.01" value="0.85" /></label>
                <label class="effect-slider" title="Large bright and dim patches, chunky whitewater with dark gaps, and a churning skyline, all carried downstream by the flow"><span class="control-label">Crest variation <output for="crestVariation" id="crestVariation-value">100%</output></span><input id="crestVariation" type="range" min="0" max="1.5" step="0.01" value="1" /></label>
              </fieldset>
              <fieldset><legend>Lens</legend>
                <label class="effect-slider" title="Long, thin, blue horizontal streaks from the brightest parts of the picture, like an anamorphic lens. Replaces the old faint horizontal flare, which cross-fades back in below 25%. Scales with Bloom."><span class="control-label">Streak bloom <output for="streak" id="streak-value">100%</output></span><input id="streak" type="range" min="0" max="2" step="0.01" value="1" /></label>
                <label class="effect-slider" title="How far the streaks reach across the frame. 0% switches them off."><span class="control-label">Streak length <output for="streakLength" id="streakLength-value">75%</output></span><input id="streakLength" type="range" min="0" max="1" step="0.01" value="0.75" /></label>
                <label class="effect-slider" title="How blue the streaks turn as they reach out. 0% keeps the colour of the light they come from."><span class="control-label">Streak tint <output for="streakTint" id="streakTint-value">80%</output></span><input id="streakTint" type="range" min="0" max="1" step="0.01" value="0.8" /></label>
                <label class="effect-slider" title="A few very bright sources that pass behind the field. The edge flashes briefly where it crosses one steeply, as at the bow; a source gliding along a level edge does not flash. The reference shot meets one at the bow at about 2 s."><span class="control-label">Hero flares <output for="heroFlares" id="heroFlares-value">100%</output></span><input id="heroFlares" type="range" min="0" max="2" step="0.01" value="1" /></label>
                <label class="effect-slider" title="The brightest stars stretch sideways into long thin lines instead of glowing as round blobs"><span class="control-label">Star streaks <output for="starStreaks" id="starStreaks-value">100%</output></span><input id="starStreaks" type="range" min="0" max="1.5" step="0.01" value="1" /></label>
                <label class="effect-slider" title="Darkens the corners of the picture, in scene light like a real lens, on top of its original gentle falloff, down to the Black level floor but never below it. Follows the 2.39:1 picture when letterboxed."><span class="control-label">Vignette <output for="vignette" id="vignette-value">100%</output></span><input id="vignette" type="range" min="0" max="2" step="0.01" value="1" /></label>
              </fieldset>
              <fieldset><legend>Film</legend>
                <label class="effect-slider" title="Fine, soft film grain. It changes once per simulation frame and holds still while paused."><span class="control-label">Grain <output for="grain" id="grain-value">100%</output></span><input id="grain" type="range" min="0" max="2" step="0.01" value="1" /></label>
                <label class="effect-slider" title="A slight overall softness, like the photographed clip"><span class="control-label">Softness <output for="softness" id="softness-value">100%</output></span><input id="softness" type="range" min="0" max="2" step="0.01" value="1" /></label>
                <label class="effect-slider" title="Defocuses the space beyond the field when the camera is close to it, as in the bow close-up. Little effect in wide shots."><span class="control-label">Depth of field <output for="focus" id="focus-value">100%</output></span><input id="focus" type="range" min="0" max="2" step="0.01" value="1" /></label>
                <label class="effect-slider" title="Large, soft, out-of-focus gas whipping past close to the lens, and the haze it lays over the frame. Strongest close to the field."><span class="control-label">Speed dust <output for="dust" id="dust-value">100%</output></span><input id="dust" type="range" min="0" max="2" step="0.01" value="1" /></label>
                <label class="effect-slider" title="Blue-teal grade with occasional magenta. It keeps each pixel's brightness, is greyer close to the field (the hazy opening) and tames only the most saturated colours elsewhere. Never lifts the blacks (Black level does that)."><span class="control-label">Grade <output for="grade" id="grade-value">100%</output></span><input id="grade" type="range" min="0" max="2" step="0.01" value="1" /></label>
                <label class="check-label" title="2.39:1 bars during the reference and flyby camera moves when the window's width is at least 1.2 times its height but narrower than 2.39:1"><input type="checkbox" id="letterbox" checked /> Letterbox (sequences)</label>
              </fieldset>
              <fieldset><legend>Gas</legend>
                <label class="effect-slider" title="How strongly the surrounding gas reacts to the field: kept out of the bubbles, piled up against them and streaming around them. 0% lets the gas ignore the field, as before."><span class="control-label">Gas interaction <output for="gas" id="gas-value">100%</output></span><input id="gas" type="range" min="0" max="2" step="0.01" value="1" /></label>
                <label class="effect-slider" title="Stand-off and depth of the clumpy bow-shock sheets ahead of the nose: two thin ones hugging it, and in the wider views a broad, faint one standing well off it. 0% removes the bow shock; the layer against the surface stays."><span class="control-label">Bow-shock thickness <output for="gasShock" id="gasShock-value">100%</output></span><input id="gasShock" type="range" min="0" max="3" step="0.01" value="1" /></label>
                <label class="effect-slider" title="How much gas piles up in the compressed layer against the outside of the field: deepest and densest under it, where the banks press against it, and thin over the dark interiors. Lit from above by the space around it, in strands that follow the surface."><span class="control-label">Pile-up <output for="gasPileup" id="gasPileup-value">100%</output></span><input id="gasPileup" type="range" min="0" max="3" step="0.01" value="1" /></label>
                <label class="effect-slider" title="Depth of the compressed layer outside the surface: about a tenth of the local radius, thin round the nose and deepest under the field. 0% removes the layer; the bow shock stays."><span class="control-label">Pile-up depth <output for="gasDepth" id="gasDepth-value">100%</output></span><input id="gasDepth" type="range" min="0" max="2" step="0.01" value="1" /></label>
                <label class="effect-slider" title="How strongly the gas is deflected around the field and drawn out along its surface, slowed at the nose and sped up along the flanks. It always streams downstream."><span class="control-label">Flow deflection <output for="gasFlow" id="gasFlow-value">100%</output></span><input id="gasFlow" type="range" min="0" max="1.5" step="0.01" value="1" /></label>
              </fieldset>
              <fieldset><legend>Bow</legend>
                <label class="effect-slider" title="Colour dispersion: the lens bends red a little less and blue a little more than green, so what it bends near the rim breaks into soft red and cyan fringes, most of all round the nose, and the rim and its arcs carry a thin colour fringe. A length on the field: it shrinks below a pixel as the camera pulls back, so the wide shot gets no colour outline. 0% bends all colours alike, as before."><span class="control-label">Dispersion <output for="dispersion" id="dispersion-value">100%</output></span><input id="dispersion" type="range" min="0" max="2" step="0.01" value="1" /></label>
                <label class="effect-slider" title="Soap-film colours on the glass: faint red, amber, green and cyan patches on the rim, crest and bow arcs, and sparse soft pale spots between the arcs, carried downstream by the flow. Strongest round the nose, a faint trace downstream. 0% leaves the glass uncoloured."><span class="control-label">Iridescence <output for="iridescence" id="iridescence-value">100%</output></span><input id="iridescence" type="range" min="0" max="2" step="0.01" value="1" /></label>
                <label class="effect-slider" title="Brightness of three nested sheets of glass just inside the bow, so the nose reads as several faint, smeared, broken, slightly wobbly arcs fanning out from the tip instead of one. They close up into the rim downstream and hand over to it as the camera pulls back or turns away from side-on. 0% leaves a single arc."><span class="control-label">Bow layers <output for="bowLayers" id="bowLayers-value">100%</output></span><input id="bowLayers" type="range" min="0" max="2" step="0.01" value="1" /></label>
                <label class="effect-slider" title="How far apart the nested bow arcs sit: a share of the way to the axis, so they fan out from the tip. Toward the top of the range the deepest arcs ease off and fade before the axis, so none ever reaches it. 0% merges them into the one rim."><span class="control-label">Layer spread <output for="layerSpread" id="layerSpread-value">100%</output></span><input id="layerSpread" type="range" min="0" max="2" step="0.01" value="1" /></label>
              </fieldset>
              <fieldset class="experiments"><legend>Experiments</legend>
                <label class="check-label" title="Experiment: the interiors give up the light the rim gathers, so they darken most under bright crest patches"><input type="checkbox" id="energyRim" checked /> Energy-conserving rim</label>
                <label class="check-label" title="Experiment: the surrounding gas streams around the field (a potential flow around the bubble chain), piles up in a compressed layer against it, stands off the nose in a bow shock, and stays out of the bubbles. Off restores gas that ignores the field."><input type="checkbox" id="gasReacts" checked /> Gas reacts to field</label>
                <label class="check-label" title="Experiment: the soap film's thickness is carried by the fluid dye, so its colours swirl and stream downstream with the flow. Off, the colours depend only on the viewing angle and the layer, and the spots between the arcs only on their place along the bow, so all of it sits still."><input type="checkbox" id="filmFlow" checked /> Fluid-driven film thickness</label>
                <label class="check-label" title="Experiment: each nested bow arc is a thin lens ring of its own, so the space seen through the nose is gathered into each arc and parted between them (and, with Dispersion, fringed at each). Off, only the outer surface bends light. Needs Bow layers."><input type="checkbox" id="layerRefraction" checked /> Layered refraction</label>
              </fieldset>
              <div class="effects-actions">
                <label class="check-label" title="Temporarily show the original look without moving the sliders"><input type="checkbox" id="effectsBypass" /> Bypass all effects (A/B)</label>
                <span><button type="button" id="effects-reset" title="Restore the tuned defaults">Defaults</button><button type="button" id="effects-off" title="Set every effect to 0% / off">All off</button></span>
              </div>
            </div>
          </details>
        </div>
      </section>
      <footer class="interface footer"><span id="hint">Drag to look around in orbit view</span><div><button id="capture">Save frame</button><span class="separator">/</span><button id="hide">Hide controls <kbd>H</kbd></button></div></footer>
      <button id="show" class="show-controls" hidden>Show controls <kbd>H</kbd></button>
      <div id="loading" class="loading"><span class="loading-ring"></span><p>Forming warp field</p></div>
      <div id="error" class="error" hidden><h2>The warp field couldn’t start.</h2><p id="error-message"></p><button onclick="location.reload()">Try again</button></div>
      <div id="notice" role="status"></div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
